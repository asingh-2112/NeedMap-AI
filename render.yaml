services:
  - type: web
    name: needmap-api
    runtime: python
    region: singapore  # Change to your preferred region
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET_KEY
        sync: false  # Set manually in Render dashboard
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: APP_NAME
        value: "NeedMap AI"
      - key: RUN_MIGRATIONS
        value: "true"
      # ── Gemini — Vertex AI (primary) + AI Studio (fallback) ──
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false  # Path to service account JSON (from Google Cloud Console)
      - key: GEMINI_API_KEY
        sync: false  # AI Studio fallback key (https://aistudio.google.com/apikey)
      - key: LLM_MODEL
        value: "gemini-2.5-flash"
